services:
  ipa-signer:
    # Sostituisci OWNER con il tuo utente/organizzazione GitHub (tutto minuscolo)
    image: ghcr.io/OWNER/ipa-signer:latest
    # Per compilare in locale invece di scaricare l'immagine: docker compose up -d --build
    build: .
    container_name: ipa-signer
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      - ipa-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.PORT || 3000) + '/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  ipa-data:
